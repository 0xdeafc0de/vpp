services:
  vpp-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vpp-dev:stable2502
    container_name: vpp-dev
    working_dir: /workspace/vpp
    stdin_open: true
    tty: true
    init: true
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      core: -1
      memlock: -1
    environment:
      CCACHE_DIR: /root/.cache/ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 10G
      MAKEFLAGS: BR=/cache/vpp-build-root
      VPP_GIT_DESCRIBE_FALLBACK: v25.02-0-gcontainer
    volumes:
      - .:/workspace/vpp
      - vpp-build-cache:/cache/vpp-build-root
      - vpp-ccache:/root/.cache/ccache
      - vpp-run:/run/vpp
    command: ["sleep", "infinity"]

volumes:
  vpp-build-cache:
  vpp-ccache:
  vpp-run:
